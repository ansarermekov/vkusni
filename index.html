<title>Абаттандыру тесті</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Mono&family=PT+Sans+Narrow:wght@400;700&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: a drawing sheet. A title block sits on top, then one question per sheet, with a survey-ruler progress strip. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --ink: #16222e;
  --muted: #566574;
  --rule: #c3cbd4;
  --accent: #0e5a8a;
  --on-accent: #ffffff;
  --ok: #16794c;
  --ok-bg: #e3f3ea;
  --on-ok: #ffffff;
  --bad: #b3261e;
  --bad-bg: #fbe8e6;
  --on-bad: #ffffff;
  --font-display: "PT Sans Narrow", "Arial Narrow", Arial, sans-serif;
  --font-body: "PT Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "PT Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1822; --surface: #15222f; --ink: #e6edf3; --muted: #94a4b4; --rule: #2c3d4e;
    --accent: #5ab0e6; --on-accent: #08121a;
    --ok: #4cc38a; --ok-bg: #123021; --on-ok: #07140d;
    --bad: #ff8f86; --bad-bg: #3b1916; --on-bad: #2a0a07;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1822; --surface: #15222f; --ink: #e6edf3; --muted: #94a4b4; --rule: #2c3d4e;
  --accent: #5ab0e6; --on-accent: #08121a;
  --ok: #4cc38a; --ok-bg: #123021; --on-ok: #07140d;
  --bad: #ff8f86; --bad-bg: #3b1916; --on-bad: #2a0a07;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.45;
  padding-block: 20px 56px;
}
.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.lbl {
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--muted);
}
.mono { font-family: var(--font-mono); }

/* title block */
.tb { display: grid; grid-template-columns: 1fr auto auto; border: 1.5px solid var(--ink); background: var(--surface); }
.tb > div { padding: 10px 14px 12px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.tb > div + div { border-left: 1.5px solid var(--ink); }
.tb .val { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 1.12; }
.tb h1.val { font-size: 26px; }
.tb .val.small { font-family: var(--font-mono); font-weight: 400; font-size: 20px; }
@media (max-width: 560px) {
  .tb { grid-template-columns: 1fr 1fr; }
  .tb > div:first-child { grid-column: 1 / -1; }
  .tb > div:nth-child(n+2) { border-top: 1.5px solid var(--ink); }
  .tb > div:nth-child(2) { border-left: 0; }
}

/* home */
.home-grid { display: grid; gap: 28px; margin-top: 28px; }
.sect-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
.toggles { display: grid; gap: 4px; }
.tg { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.tg input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.big-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 1.5px solid var(--ink);
  background: var(--surface);
  padding: 12px 18px;
  min-height: 48px;
  font-weight: 700;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { color: var(--on-accent); filter: brightness(1.08); }
.btn[disabled] { opacity: .45; cursor: default; }
.toc { border-top: 1.5px solid var(--ink); }
.toc button {
  display: grid;
  grid-template-columns: 76px 1fr auto;
  align-items: baseline;
  gap: 12px;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: 14px 4px;
}
.toc button:hover { background: var(--surface); }
.toc .wk { font-family: var(--font-mono); color: var(--accent); font-weight: 700; }
.toc .nm { min-width: 0; }
.toc .ct { font-family: var(--font-mono); color: var(--muted); font-size: 14px; white-space: nowrap; }

/* quiz */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.linkbtn { background: none; border: 0; padding: 8px 0; min-height: 44px; color: var(--accent); font-weight: 700; }
.linkbtn:hover { text-decoration: underline; }
.stats { display: flex; gap: 14px; font-family: var(--font-mono); font-size: 14px; }
.stats .s-ok { color: var(--ok); }
.stats .s-bad { color: var(--bad); }
.ruler { display: flex; gap: 3px; align-items: flex-end; height: 18px; margin-bottom: 18px; }
.ruler i { flex: 1; min-width: 0; height: 10px; background: var(--rule); }
.ruler.dense { gap: 1px; }
.ruler.dense i:nth-child(5n) { height: 14px; }
.ruler.dense i:nth-child(10n) { height: 18px; }
.ruler i.ok { background: var(--ok); }
.ruler i.bad { background: var(--bad); }
.ruler i.cur { background: var(--accent); }
.sheet { background: var(--surface); border: 1.5px solid var(--ink); padding: 20px 18px 18px; display: grid; gap: 14px; }
.sheet h2 { font-size: 26px; line-height: 1.2; font-weight: 700; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 14px;
  align-items: start;
  text-align: left;
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--rule);
  padding: 12px 14px;
  min-height: 54px;
}
.opt .mk {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border: 1.5px solid var(--ink);
  font-family: var(--font-mono);
  font-weight: 700;
}
.opt .tx { padding-top: 4px; min-width: 0; overflow-wrap: anywhere; }
.opts:not(.locked) .opt:hover { border-color: var(--accent); }
.opts:not(.locked) .opt:hover .mk { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opts.locked .opt { cursor: default; }
.opts.locked .opt:not(.ok):not(.bad) { opacity: .6; }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.ok .mk { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.bad .mk { background: var(--bad); border-color: var(--bad); color: var(--on-bad); }
.fb { min-height: 26px; font-weight: 700; }
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }
.nav { display: flex; justify-content: flex-end; }
.hint { margin-top: 14px; color: var(--muted); font-size: 14px; }
@media (max-width: 560px) { .hint { display: none; } .nav .btn { width: 100%; } }

/* result */
.score { display: grid; grid-template-columns: auto 1fr; gap: 6px 24px; align-items: end; margin-top: 28px; padding-bottom: 22px; border-bottom: 1.5px solid var(--ink); }
.score .big { font-family: var(--font-display); font-weight: 700; font-size: 84px; line-height: .95; }
.score .big small { font-size: 36px; color: var(--muted); }
.score .verdict { font-family: var(--font-display); font-size: 26px; font-weight: 700; align-self: center; }
.score .pct { font-family: var(--font-mono); color: var(--muted); }
.res-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 30px; }
.wrong-list { display: grid; gap: 14px; padding: 0; margin: 0; list-style: none; }
.wrong-list li { background: var(--surface); border: 1.5px solid var(--rule); padding: 14px 16px; display: grid; gap: 8px; }
.wrong-list .q { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.2; }
.wrong-list .a { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: baseline; }
.wrong-list .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 1px 6px; }
.wrong-list .tag.b { background: var(--bad); color: var(--on-bad); }
.wrong-list .tag.g { background: var(--ok); color: var(--on-ok); }
.all-ok { padding: 16px; border: 1.5px solid var(--ok); background: var(--ok-bg); font-weight: 700; }

@media (prefers-reduced-motion: no-preference) {
  .opt, .btn, .ruler i { transition: background-color .12s, border-color .12s, color .12s; }
}
</style>

<div class="wrap">
  <header class="tb">
    <div>
      <span class="lbl">Пән</span>
      <h1 class="val">Территорияларды инженерлік абаттандыру</h1>
    </div>
    <div>
      <span class="lbl">Материал</span>
      <span class="val small">8–12 апта</span>
    </div>
    <div>
      <span class="lbl">Сұрақ</span>
      <span class="val small" id="tbCount">78</span>
    </div>
  </header>

  <main>
    <section id="home" class="home-grid">
      <div>
        <h2 class="sect-title">Емтиханға дайындық тесті</h2>
        <div class="toggles">
          <label class="tg"><input type="checkbox" id="optShuffleQ"> <span>Сұрақтар ретін араластыру</span></label>
          <label class="tg"><input type="checkbox" id="optShuffleA" checked> <span>Жауап нұсқаларын араластыру</span></label>
        </div>
      </div>
      <div class="big-actions">
        <button class="btn primary" id="startAll" type="button"></button>
        <button class="btn" id="startRand" type="button">Кездейсоқ 20 сұрақ</button>
      </div>
      <div>
        <h2 class="sect-title">Тақырып бойынша</h2>
        <div class="toc" id="toc"></div>
      </div>
    </section>

    <section id="quiz" hidden>
      <div class="topbar">
        <button class="linkbtn" id="back" type="button">← Мәзір</button>
        <div class="stats" aria-live="off">
          <span class="s-ok">Дұрыс: <b id="stOk">0</b></span>
          <span class="s-bad">Қате: <b id="stBad">0</b></span>
          <span id="stPos">1 / 1</span>
        </div>
      </div>
      <div class="ruler" id="ruler" aria-hidden="true"></div>
      <article class="sheet">
        <p class="lbl" id="qmeta"></p>
        <h2 id="qtext"></h2>
        <div class="opts" id="opts" role="group" aria-labelledby="qtext"></div>
        <p class="fb" id="fb" role="status" aria-live="polite"></p>
        <div class="nav"><button class="btn primary" id="next" type="button" disabled>Келесі →</button></div>
      </article>
      <p class="hint">Пернетақта: 1–4 жауап таңдайды, Enter немесе → келесі сұраққа өтеді.</p>
    </section>

    <section id="result" hidden>
      <div class="score">
        <div class="big"><span id="rOk">0</span><small> / <span id="rTotal">0</span></small></div>
        <div class="verdict" id="rVerdict"></div>
        <div class="pct" id="rPct"></div>
      </div>
      <div class="res-actions">
        <button class="btn primary" id="retryWrong" type="button">Қателерді қайталау</button>
        <button class="btn" id="restart" type="button">Қайта бастау</button>
        <button class="btn" id="toMenu" type="button">Мәзір</button>
      </div>
      <div id="wrongBox"></div>
    </section>
  </main>
</div>

 мен тамыр жүйесі жобалауда неге ескеріледі?","o":["Оларға жерүсті және жерасты кеңістігі қажет","Олар инженерлік желілерге еш әсер етпейді","Олар тек сәндік сызбада болады","Оларға топырақ көлемі қажет емес"],"s":4,"no":76},{"q":"Топырақтың тұздануы өсімдікке қалай әсер етуі мүмкін?","o":["Өсуін нашарлатып, зақым келтіруі мүмкін","Әрқашан өсуді жақсартады","Барлық түрге бірдей пайдалы","Тек жапырақ түсін өзгертеді"],"s":4,"no":77},{"q":"Көгалдандыру шешімдері жобаның қай кезеңінде ескерілуі тиіс?","o":["Алғашқы жобалау кезеңінен бастап","Тек пайдалануға берілген соң","Тек құрылыс аяқталған соң","Тек жиһаз таңдау кезінде"],"s":4,"no":78}];
  var LETTERS = ['A', 'B', 'C', 'D'];

  function $(id) { return document.getElementById(id); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  var S = { queue: [], i: 0, picked: [], ok: 0, bad: 0 };

  function show(name) {
    ['home', 'quiz', 'result'].forEach(function (n) { $(n).hidden = (n !== name); });
    window.scrollTo(0, 0);
  }

  function build(list, shuffleQ, shuffleA) {
    var qs = shuffleQ ? shuffle(list) : list.slice();
    return qs.map(function (src) {
      var opts = src.o.map(function (t, k) { return { t: t, ok: k === 0 }; });
      if (shuffleA) opts = shuffle(opts);
      return { src: src, opts: opts };
    });
  }

  function start(list, forceShuffleQ) {
    var sq = forceShuffleQ || $('optShuffleQ').checked;
    S.queue = build(list, sq, $('optShuffleA').checked);
    S.i = 0; S.ok = 0; S.bad = 0;
    S.picked = S.queue.map(function () { return null; });
    var r = $('ruler');
    r.textContent = '';
    r.className = 'ruler' + (S.queue.length > 40 ? ' dense' : '');
    S.queue.forEach(function () { r.appendChild(document.createElement('i')); });
    show('quiz');
    renderQ();
  }

  function renderStats() {
    $('stOk').textContent = S.ok;
    $('stBad').textContent = S.bad;
    $('stPos').textContent = (S.i + 1) + ' / ' + S.queue.length;
  }

  function renderRuler() {
    var ticks = $('ruler').children;
    for (var k = 0; k < ticks.length; k++) {
      var p = S.picked[k], cls = '';
      if (p !== null) cls = S.queue[k].opts[p].ok ? 'ok' : 'bad';
      else if (k === S.i) cls = 'cur';
      ticks[k].className = cls;
    }
  }

  function renderQ() {
    var item = S.queue[S.i], src = item.src;
    var sec = SECTIONS[src.s];
    $('qmeta').textContent = sec.wk + ' · сұрақ № ' + src.no;
    $('qtext').textContent = src.q;
    var box = $('opts');
    box.textContent = '';
    box.classList.remove('locked');
    item.opts.forEach(function (o, k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      var mk = document.createElement('span');
      mk.className = 'mk'; mk.textContent = LETTERS[k];
      var tx = document.createElement('span');
      tx.className = 'tx'; tx.textContent = o.t;
      b.appendChild(mk); b.appendChild(tx);
      b.addEventListener('click', function () { answer(k); });
      box.appendChild(b);
    });
    var fb = $('fb'); fb.textContent = ''; fb.className = 'fb';
    var nx = $('next');
    nx.disabled = true;
    nx.textContent = (S.i === S.queue.length - 1) ? 'Нәтижені көру' : 'Келесі →';
    renderStats();
    renderRuler();
  }

  function answer(k) {
    if (S.picked[S.i] !== null) return;
    S.picked[S.i] = k;
    var item = S.queue[S.i];
    var right = item.opts[k].ok;
    if (right) S.ok++; else S.bad++;
    var box = $('opts');
    box.classList.add('locked');
    var btns = box.children;
    for (var j = 0; j < btns.length; j++) {
      var mk = btns[j].firstChild;
      if (item.opts[j].ok) { btns[j].classList.add('ok'); mk.textContent = '✓'; }
      else if (j === k) { btns[j].classList.add('bad'); mk.textContent = '✕'; }
    }
    var fb = $('fb');
    if (right) { fb.textContent = 'Дұрыс!'; fb.className = 'fb ok'; }
    else {
      var ci = item.opts.findIndex(function (o) { return o.ok; });
      fb.textContent = 'Қате. Дұрыс жауап: ' + LETTERS[ci] + '.';
      fb.className = 'fb bad';
    }
    $('next').disabled = false;
    $('next').focus({ preventScroll: true });
    renderStats();
    renderRuler();
  }

  function next() {
    if (S.picked[S.i] === null) return;
    if (S.i === S.queue.length - 1) { finish(); return; }
    S.i++;
    renderQ();
    window.scrollTo(0, 0);
  }

  function verdict(p) {
    if (p >= 90) return 'Өте жақсы';
    if (p >= 70) return 'Жақсы';
    if (p >= 50) return 'Қанағаттанарлық';
    return 'Қайталап шығыңыз';
  }

  function finish() {
    var total = S.queue.length;
    var pct = Math.round(S.ok / total * 100);
    $('rOk').textContent = S.ok;
    $('rTotal').textContent = total;
    $('rPct').textContent = pct + ' %';
    $('rVerdict').textContent = verdict(pct);
    var wrong = [];
    S.queue.forEach(function (item, k) {
      var p = S.picked[k];
      if (p !== null && !item.opts[p].ok) wrong.push({ item: item, picked: p });
    });
    var box = $('wrongBox');
    box.textContent = '';
    S.wrongSrc = wrong.map(function (w) { return w.item.src; });
    $('retryWrong').hidden = wrong.length === 0;
    if (wrong.length === 0) {
      var ok = document.createElement('p');
      ok.className = 'all-ok';
      ok.textContent = 'Барлық сұраққа дұрыс жауап бердіңіз.';
      box.appendChild(ok);
    } else {
      var h = document.createElement('h2');
      h.className = 'sect-title';
      h.textContent = 'Қателер (' + wrong.length + ')';
      box.appendChild(h);
      var ul = document.createElement('ul');
      ul.className = 'wrong-list';
      wrong.forEach(function (w) {
        var li = document.createElement('li');
        var q = document.createElement('div');
        q.className = 'q'; q.textContent = w.item.src.q;
        li.appendChild(q);
        [['b', 'Сіз', w.item.opts[w.picked].t],
         ['g', 'Дұрыс', w.item.opts.filter(function (o) { return o.ok; })[0].t]].forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'a';
          var tag = document.createElement('span');
          tag.className = 'tag ' + r[0]; tag.textContent = r[1];
          var tx = document.createElement('span');
          tx.textContent = r[2];
          row.appendChild(tag); row.appendChild(tx);
          li.appendChild(row);
        });
        ul.appendChild(li);
      });
      box.appendChild(ul);
    }
    S.lastList = S.queue.map(function (it) { return it.src; });
    show('result');
  }

  // home
  $('tbCount').textContent = DATA.length;
  $('startAll').textContent = 'Барлық сұрақтар (' + DATA.length + ')';
  var toc = $('toc');
  SECTIONS.forEach(function (sec, idx) {
    var list = DATA.filter(function (q) { return q.s === idx; });
    var b = document.createElement('button');
    b.type = 'button';
    var a = document.createElement('span'); a.className = 'wk'; a.textContent = sec.wk;
    var n = document.createElement('span'); n.className = 'nm'; n.textContent = sec.name;
    var c = document.createElement('span'); c.className = 'ct'; c.textContent = list.length + ' сұрақ';
    b.appendChild(a); b.appendChild(n); b.appendChild(c);
    b.addEventListener('click', function () { start(list, false); });
    toc.appendChild(b);
  });
  $('startAll').addEventListener('click', function () { start(DATA, false); });
  $('startRand').addEventListener('click', function () { start(shuffle(DATA).slice(0, 20), true); });
  $('back').addEventListener('click', function () { show('home'); });
  $('toMenu').addEventListener('click', function () { show('home'); });
  $('next').addEventListener('click', next);
  $('restart').addEventListener('click', function () { start(S.lastList, false); });
  $('retryWrong').addEventListener('click', function () { if (S.wrongSrc && S.wrongSrc.length) start(S.wrongSrc, true); });

  document.addEventListener('keydown', function (e) {
    if ($('quiz').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key >= '1' && e.key <= '4') {
      if (S.picked[S.i] === null) answer(Number(e.key) - 1);
    } else if ((e.key === 'Enter' || e.key === 'ArrowRight') && S.picked[S.i] !== null && document.activeElement !== $('next')) {
      e.preventDefault();
      next();
    }
  });
})();
</script>
